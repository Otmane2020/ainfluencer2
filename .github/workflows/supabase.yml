name: Supabase Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1

      - name: Link project
        run: supabase link --project-ref vgffjuvaedmxoxvzovoq
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push DB migrations
        run: supabase db push --password $SUPABASE_DB_PASSWORD
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref vgffjuvaedmxoxvzovoq --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # -------------------------
      # SUCCESS WEBHOOK
      # -------------------------
      - name: Notify Deploy Success
        if: success()
        run: |
          curl -s -X POST https://vgffjuvaedmxoxvzovoq.supabase.co/functions/v1/deploy-webhook \
            -H "Content-Type: application/json" \
            -d '{
              "status": "success",
              "commit": "${{ github.sha }}",
              "actor": "${{ github.actor }}",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }'
        continue-on-error: true

      # -------------------------
      # FAILURE WEBHOOK
      # -------------------------
      - name: Notify Deploy Failure
        if: failure()
        run: |
          curl -s -X POST https://vgffjuvaedmxoxvzovoq.supabase.co/functions/v1/deploy-webhook \
            -H "Content-Type: application/json" \
            -d '{
              "status": "error",
              "commit": "${{ github.sha }}",
              "actor": "${{ github.actor }}",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }'
        continue-on-error: true
