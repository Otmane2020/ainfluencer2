name: Supabase Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: vgffjuvaedmxoxvzovoq

    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1

      - name: Link ClipMotion project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push DB migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy all Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Notify Deploy Success
        if: success()
        run: |
          curl -s -X POST "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/deploy-error-webhook" \
            -H "Content-Type: application/json" \
            -d '{
              "status": "success",
              "commit": "${{ github.sha }}",
              "actor": "${{ github.actor }}",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }'
        continue-on-error: true

      - name: Notify Deploy Failure
        if: failure()
        run: |
          curl -s -X POST "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/deploy-error-webhook" \
            -H "Content-Type: application/json" \
            -d '{
              "status": "error",
              "commit": "${{ github.sha }}",
              "actor": "${{ github.actor }}",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }'
        continue-on-error: true
