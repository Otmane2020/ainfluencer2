name: Supabase Edge Functions Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Déploiement manuel (Actions → Supabase Edge Functions Deploy → Run workflow)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1

      - name: Link Supabase project
        run: supabase link --project-ref axwwpawvezqsybttulyo
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref axwwpawvezqsybttulyo --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
