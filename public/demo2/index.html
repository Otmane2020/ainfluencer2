<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>ClipMotion – Product Shoot Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --black: #06080A;
    --gold: #D4A853;
    --gold2: #F0C96B;
    --white: #F5F0E8;
    --muted: rgba(245,240,232,0.45);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background: var(--black);
    overflow: hidden;
    font-family: 'DM Sans', sans-serif;
  }

  /* STAGE */
  #stage {
    width:100vw; height:100vh;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* GRAIN */
  #stage::before {
    content:'';
    position:absolute; inset:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events:none; z-index:10;
  }

  /* ── SCENE 1: ONE PHOTO ── */
  #scene1 {
    position: absolute; inset:0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    opacity:1;
    animation: scene1Out 0.8s 4.5s ease forwards;
  }

  @keyframes scene1Out {
    to { opacity:0; transform:scale(0.95); }
  }

  .scene1-label {
    font-size: clamp(0.7rem, 2vw, 0.82rem);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 24px;
    animation: fadeUp 0.7s 0.3s ease both;
  }

  .one-photo-wrap {
    position: relative;
    animation: fadeUp 0.7s 0.5s ease both;
  }

  .one-photo {
    width: min(280px, 60vw);
    aspect-ratio: 1;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.08);
    background: #0F1317;
  }
  .one-photo img {
    width:100%; height:100%;
    object-fit: cover;
  }

  .photo-badge {
    position: absolute;
    top: -12px; left: 50%;
    transform: translateX(-50%);
    background: rgba(212,168,83,0.15);
    border: 1px solid rgba(212,168,83,0.4);
    color: var(--gold);
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 100px;
    white-space: nowrap;
  }

  .scene1-arrow {
    margin-top: 28px;
    color: var(--muted);
    font-size: 0.82rem;
    display: flex;
    align-items: center;
    gap: 10px;
    animation: fadeUp 0.7s 0.9s ease both;
  }

  .arrow-line {
    width: 40px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold));
    animation: growLine 0.6s 1.5s ease both;
    transform-origin: left;
    transform: scaleX(0);
  }
  @keyframes growLine {
    to { transform: scaleX(1); }
  }

  /* ── PROCESSING ── */
  #scene-processing {
    position: absolute; inset:0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    opacity:0;
    animation: procIn 0.6s 5s ease forwards, procOut 0.6s 7.8s ease forwards;
  }

  @keyframes procIn { to { opacity:1; } }
  @keyframes procOut { to { opacity:0; } }

  .proc-ring {
    width: 72px; height: 72px;
    border-radius: 50%;
    border: 2px solid rgba(212,168,83,0.15);
    border-top-color: var(--gold);
    animation: spin 0.9s linear infinite;
    margin-bottom: 24px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .proc-text {
    font-size: 0.82rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .proc-dots span {
    animation: blink 1.2s infinite;
    opacity:0;
  }
  .proc-dots span:nth-child(2) { animation-delay: 0.2s; }
  .proc-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%,80%,100% { opacity:0; }
    40% { opacity:1; }
  }

  .proc-count {
    margin-top: 12px;
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    color: var(--gold);
    animation: countUp 2.5s 5.2s ease both;
  }
  @keyframes countUp {
    0% { opacity:0; } 10% { opacity:1; }
  }

  /* ── SCENE 2: GALLERY REVEAL ── */
  #scene2 {
    position: absolute; inset:0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px;
    opacity: 0;
    animation: scene2In 0.8s 8.2s ease forwards;
  }
  @keyframes scene2In { to { opacity:1; } }

  .reveal-header {
    text-align: center;
    margin-bottom: 20px;
  }

  .reveal-tag {
    font-size: 0.68rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    opacity:0;
    animation: fadeUp 0.5s 8.5s ease forwards;
  }

  .reveal-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.5rem, 5vw, 2.4rem);
    color: var(--white);
    margin-top: 8px;
    opacity:0;
    animation: fadeUp 0.5s 8.7s ease forwards;
  }
  .reveal-title em {
    color: var(--gold);
    font-style: normal;
  }

  /* GRID 2x3 */
  .gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    width: 100%;
    max-width: 520px;
  }

  .gcard {
    border-radius: 12px;
    overflow: hidden;
    aspect-ratio: 1;
    background: #0F1317;
    border: 1px solid rgba(255,255,255,0.06);
    opacity: 0;
    transform: scale(0.85) translateY(20px);
    position: relative;
  }

  .gcard img {
    width:100%; height:100%;
    object-fit: cover;
    transition: transform 0.3s;
  }

  .gcard-label {
    position: absolute;
    bottom:0; left:0; right:0;
    padding: 8px 10px;
    background: linear-gradient(transparent, rgba(6,8,10,0.85));
    font-size: 0.62rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(245,240,232,0.7);
  }

  /* Staggered card reveal */
  .gcard:nth-child(1) { animation: cardIn 0.5s 8.8s ease forwards; }
  .gcard:nth-child(2) { animation: cardIn 0.5s 9.1s ease forwards; }
  .gcard:nth-child(3) { animation: cardIn 0.5s 9.4s ease forwards; }
  .gcard:nth-child(4) { animation: cardIn 0.5s 9.7s ease forwards; }
  .gcard:nth-child(5) { animation: cardIn 0.5s 10.0s ease forwards; }
  .gcard:nth-child(6) { animation: cardIn 0.5s 10.3s ease forwards; }

  @keyframes cardIn {
    to { opacity:1; transform: scale(1) translateY(0); }
  }

  /* BOTTOM CTA */
  .reveal-cta {
    margin-top: 20px;
    text-align: center;
    opacity:0;
    animation: fadeUp 0.6s 10.8s ease forwards;
  }

  .cta-btn {
    display: inline-block;
    background: var(--gold);
    color: var(--black);
    padding: 12px 28px;
    border-radius: 8px;
    font-size: 0.88rem;
    font-weight: 500;
    text-decoration: none;
    letter-spacing: 0.02em;
  }

  .cta-sub {
    margin-top: 10px;
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  /* LOGO */
  .logo {
    position: absolute;
    top: 20px; left: 50%;
    transform: translateX(-50%);
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    color: var(--gold);
    z-index: 20;
    letter-spacing: 0.04em;
    opacity:0;
    animation: fadeUp 0.5s 0.1s ease forwards;
  }
  .logo span { color: var(--white); }

  @keyframes fadeUp {
    from { opacity:0; transform:translateY(16px); }
    to { opacity:1; transform:translateY(0); }
  }

  /* SHIMMER on cards */
  .shimmer {
    position: absolute; inset:0;
    background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.06) 50%, transparent 60%);
    background-size: 200% 100%;
    animation: shimmer 2s 9s linear;
  }
  @keyframes shimmer {
    from { background-position: 200% 0; }
    to { background-position: -200% 0; }
  }

  /* REPLAY button */
  #replay {
    position: absolute;
    bottom: 24px; right: 24px;
    background: rgba(212,168,83,0.1);
    border: 1px solid rgba(212,168,83,0.3);
    color: var(--gold);
    padding: 8px 18px;
    border-radius: 100px;
    font-size: 0.75rem;
    cursor: pointer;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    z-index: 50;
    opacity:0;
    animation: fadeUp 0.5s 11.5s ease forwards;
  }
</style>
</head>
